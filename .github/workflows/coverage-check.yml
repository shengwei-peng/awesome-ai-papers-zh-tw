name: Coverage Check

# Fails (and GitHub emails the owner) when the translator misses Hugging Face daily papers
# or does not run at all. See .github/scripts/check_coverage.py.
on:
  schedule:
    - cron: "0 5 * * *" # 13:00 Asia/Taipei: leaves 8.5h for the 04:30 translator run to finish and push
  workflow_dispatch:
    inputs:
      date:
        description: "Check only this date (YYYY-MM-DD); empty = default checks"
        required: false
      max_missing:
        description: "Untranslated papers tolerated per day"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Self-test
        run: python3 -m unittest discover -s .github/scripts

      - name: Check translated papers against Hugging Face
        env:
          CHECK_DATE: ${{ inputs.date }}
          MAX_MISSING: ${{ inputs.max_missing || '0' }}
        run: python3 .github/scripts/check_coverage.py "$CHECK_DATE"
